name: Hysteria 2.13 sync validation
on:
  push:
    branches: ["sync/hysteria-2.13-v2node-0.4.5"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
      - name: Fetch geodata fixtures in CI
        run: |
          mkdir -p resources
          for asset in geoip geosite; do
            curl -fsSL "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/$asset.dat" -o "resources/$asset.dat"
          done
      - name: Test Hysteria, QUIC consumers and XHTTP
        env:
          GOEXPERIMENT: ''
        run: |
          go test -mod=readonly -timeout 5m ./transport/internet/hysteria/... ./proxy/hysteria/... ./transport/internet/splithttp/... ./infra/conf/... ./app/dns/... ./proxy/tuic/... ./proxy/anytls/...
      - name: Build Linux core
        run: go build -mod=readonly -o /tmp/xray ./main
